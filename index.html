<!DOCTYPE html>
<html lang="en" >
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HBD | Birthday Surprise</title>
  <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/animate.css/3.5.2/animate.min.css'><link rel="stylesheet" href="style.css">

</head>
<body>
<audio id="birthday-song" src="./_Happy_Birthday_Song.mp3" autoplay loop preload="auto"></audio>
<div id="wrapper">
  <div id="celebration-decor" aria-hidden="true">
    <img class="party-garland party-garland-left" src="./img/1.png" alt="" />
    <img class="party-garland party-garland-right" src="./img/1.png" alt="" />
    <img class="party-hat" src="./img/hat.png" alt="" />
    <span class="decor balloon balloon-one">🎈</span>
    <span class="decor balloon balloon-two">🎈</span>
    <span class="decor balloon balloon-three">🎈</span>
    <span class="decor gift gift-one">🎁</span>
    <span class="decor gift gift-two">🎁</span>
    <span class="decor gift gift-three">🎁</span>
  </div>
  <h1 id="welcome">
    <span class="welcome-intro">
      <span>W</span><span>e</span><span>l</span><span>c</span><span>o</span><span>m</span><span>e</span><span> </span><span>t</span><span>o</span><span> </span><span>t</span><span>h</span><span>e</span>
    </span>
    <span class="welcome-title">Birthday Celebration!</span>
    <span class="welcome-cake">🎂</span>
  </h1>
  <div id="wish">
    <div class="wish-line wish-greeting">
      <div class="wish-word wish-happy">
        <div class="wish-letter">H</div><div class="wish-letter">A</div><div class="wish-letter">P</div><div class="wish-letter">P</div><div class="wish-letter">Y</div>
      </div>
      <span class="wish-space" aria-hidden="true"></span>
      <div class="wish-word wish-birthday">
        <div class="wish-letter">B</div><div class="wish-letter">I</div><div class="wish-letter">R</div><div class="wish-letter">T</div><div class="wish-letter">H</div><div class="wish-letter">D</div><div class="wish-letter">A</div><div class="wish-letter">Y</div>
      </div>
    </div>
    <div class="wish-line wish-name">
      <span class="wish-flair" aria-hidden="true">✨</span>
      <div class="wish-letter">A</div><div class="wish-letter">@</div><div class="wish-letter">$</div><div class="wish-letter">H</div><div class="wish-letter">R</div><div class="wish-letter">I</div><div class="wish-letter">T</div><div class="wish-letter">A</div>
      <span class="wish-flair" aria-hidden="true">🎉</span>
    </div>
  </div>
  <div class="birthday-details">
    <div class="circle" aria-hidden="true">
      <div class="text__circle">
        <span style="--i: 1;">h</span><span style="--i: 2;">a</span><span style="--i: 3;">p</span><span style="--i: 4;">p</span><span style="--i: 5;">y</span>
        <span style="--i: 6;">-</span><span style="--i: 7;">b</span><span style="--i: 8;">i</span><span style="--i: 9;">r</span><span style="--i: 10;">t</span>
        <span style="--i: 11;">h</span><span style="--i: 12;">d</span><span style="--i: 13;">a</span><span style="--i: 14;">y</span><span style="--i: 15;">-</span>
      </div>
      <span class="circle-cake" aria-label="birthday cake">🎂</span>
    </div>
    <div class="date__of__birth">
      <span class="date-star" aria-hidden="true">&#10022;</span>
      <span class="date-text" aria-label="18 November"></span>
      <span class="date-star" aria-hidden="true">&#10022;</span>
    </div>
  </div>
  <div id="present">
    <div id="cat">
      <img src="./img/a1.jpg" alt="Birthday celebrant" />
    </div>
    <div id="box">
      <span class="box-label">
        <span class="box-decoration" aria-hidden="true">✨</span>
        <span class="box-cake" aria-hidden="true">🎂</span>
        <span class="box-decoration" aria-hidden="true">🎉</span>
      </span>
    </div>
    <div id="top">
      <img src="https://pngimg.com/uploads/ribbon/ribbon_PNG1547.png" alt="" />
    </div>
  </div>
  <div id="letter-action">
    <button id="btn__letter" type="button">
      <span>Click here A@sh </span>
      <span class="letter-icon" aria-hidden="true">&#9993;</span>
    </button>
  </div>
</div>
  <script src='https://cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js'></script><script  src="script.js"></script>

</body>
</html>
